<!doctype html>
<html lang="ur">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>میرا گاؤں — Mera Gaon</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="clock"><span class="ur"></span><span class="en"></span></div>
      <div id="area"><div class="ur"></div><div class="en"></div></div>
      <div id="prompt"><kbd>E</kbd><span class="ur"></span><span class="en"></span></div>
      <div id="dialogue">
        <div class="name ur"></div>
        <div class="line ur"></div>
        <div class="en"></div>
      </div>
      <div id="toast"><div class="ur"></div><div class="en"></div></div>
      <div id="keys"></div>
    </div>

    <div id="title">
      <div class="card">
        <h1 class="ur">میرا گاؤں</h1>
        <p class="sub ur">چک نمبر ۴۷ — پنجاب کے ایک گاؤں کی سیر</p>
        <p class="sub en">A walk through a village in Punjab</p>
        <button id="start" disabled><span class="ur">ٹھہریں…</span></button>
        <table id="help"></table>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
